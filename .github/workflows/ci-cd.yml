name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        python -m pytest tests/unit/ -v --tb=short --junitxml=test-results-unit.xml

    - name: Run integration tests
      run: |
        python -m pytest tests/integration/ -v --tb=short --junitxml=test-results-integration.xml

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results-*.xml

  lint:
    name: Lint and Static Analysis
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black ruff mypy bandit

    - name: Check formatting with black
      run: |
        black --check --diff dist_upload/*.py tests/ || true

    - name: Lint with ruff
      run: |
        ruff check dist_upload/*.py tests/ || true

    - name: Type check with mypy
      run: |
        mypy --ignore-missing-imports dist_upload/machine_common.py || true

    - name: Security check with bandit
      run: |
        bandit -r dist_upload/ -ll || true

  build:
    name: Build Release Package
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build release package
      run: |
        python build_release.py

    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: machine-release
        path: dist/MachineLoader-*.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')

    steps:
    - uses: actions/checkout@v4

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: machine-release

    - name: Get version from CHANGELOG
      id: version
      run: |
        VERSION=$(grep -m1 '^## \[' CHANGELOG.md | sed 's/## \[//;s/\].*//')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Machine Loader v${{ steps.version.outputs.version }}
        body_path: CHANGELOG.md
        files: MachineLoader-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
